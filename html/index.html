<!DOCTYPE html>

<!-- DA DU SERVEUR : memes feuilles, dans le meme ordre, que la tablette
     entreprise (qbx_job_points) et les reglages du HUD (jg-hud/web/bl/tablet) :
     css/ = tablette entreprise, bl/ = charte des tablettes de bl_ui
     (html/tablet/theme.css, components.css, group.css).

     COPIES LOCALES, A DESSEIN : bl_ui demarre APRES [standalone] (server.cfg),

     charte change. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">

     permanence, elle ne doit rien peindre au repos. -->

            <nav class="ghead-crumb" id="crumb" aria-label="Fil d'ariane"></nav>

        <section class="view scroll" id="view"></section>
